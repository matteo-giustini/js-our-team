<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Our Team</title>
</head>
<body>
    <div class="container text-center">
        <h1>Meet our Team</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Labore facilis magni minima modi cupiditate aperiam ipsum delectus asperiores, aut, et nam, qui dolor. Vero aliquam nulla culpa provident, error magni.</p>
       <div class="row bg-white row-cols-1 row-cols-md-3 g-5" id="card-container">
       
       </div> 
       <form class="container mt-4 p-4 border rounded bg-light" id="form">
        <h2 class="mb-3 text-center">Aggiungi un Membro</h2>
    
        <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" placeholder="Inserisci il nome" required>
        </div>
    
        <div class="mb-3">
            <label for="role" class="form-label">Ruolo</label>
            <input type="text" class="form-control" id="role" placeholder="Inserisci il ruolo" required>
        </div>
    
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Inserisci l'email" required>
        </div>
    
        <div class="mb-3">
            <label for="image" class="form-label">Immagine</label>
            <input type="file" class="form-control" id="image">
        </div>
    
        <button type="submit" class="btn btn-primary w-100">Aggiungi</button>
    </form>
    
    </div>
    <script src="script.js"></script>
</body>
</html>
